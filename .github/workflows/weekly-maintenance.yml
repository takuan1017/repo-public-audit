name: Weekly Maintenance

on:
  schedule:
    - cron: "0 23 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Compile scripts
        run: python -m py_compile scripts/*.py src/repo_public_audit/*.py tests/*.py
      - name: Run public-readiness audit
        run: repo-public-audit . --history --history-commits 50 --format json --fail-on high > /tmp/repo-public-audit.json
      - name: Generate maintenance report
        run: |
          REPORT_DATE="$(date -u +%F)"
          python scripts/generate_maintenance_report.py \
            --audit-json /tmp/repo-public-audit.json \
            --output "docs/maintenance/${REPORT_DATE}.md"
      - name: Create maintenance pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT_DATE="$(date -u +%F)"
          BRANCH="automation/weekly-maintenance-${REPORT_DATE}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "docs/maintenance/${REPORT_DATE}.md"
          if git diff --cached --quiet; then
            echo "No maintenance report changes to publish."
            exit 0
          fi
          git commit -m "Add weekly maintenance report for ${REPORT_DATE}"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --title "Weekly maintenance report - ${REPORT_DATE}" \
            --body "Automated weekly maintenance report generated after tests and history-aware public-readiness audit passed." \
            --label automation \
            --label maintenance \
            --base main \
            --head "$BRANCH"
