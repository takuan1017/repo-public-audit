name: Daily Readiness Check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Compile scripts
        run: python -m py_compile scripts/*.py src/repo_public_audit/*.py tests/*.py
      - name: Run history-aware readiness audit
        run: repo-public-audit . --history --history-commits 50 --format json --fail-on high
